<header><div><div class="name" id="title">031 / SHEAR CRYSTALLIZATION</div><div class="subtitle" id="ancestry">DESCENDED FROM 030-liquid-crystal.html</div></div><div class="readout"><span id="meter">COHERENCE 100.000%</span><br><span id="clock">00:00.000</span></div></header>

<script>
(()=>{'use strict';
const canvas=document.getElementById('surface'),ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const seedBuffer=new Uint32Array(1);crypto.getRandomValues(seedBuffer);
const E=window.Decay={canvas,ctx,w:1,h:1,dpr:1,time:0,dt:0,seed:seedBuffer[0],generation:1,title:'SIGNAL RETENTION',level:0,pressure:0,held:false,inside:false,paused:reduced.matches,frame:0,last:0,cols:64,rows:40,grid:new Float32Array(64*40),hooks:[],resets:[],inputs:[],pointer:{x:.5,y:.5,px:.5,py:.5,speed:0},palette:['#8caa53','#555b78','#b59a52','#963d48','#766285','#b4bc91']};
let state=E.seed,spread=0,readout=0,pointerId=null;
E.rand=()=>{state^=state<<13;state^=state>>>17;state^=state<<5;return(state>>>0)/4294967296};
E.hash=n=>{const v=Math.sin(n*127.17+E.seed*.00017)*43758.54;return v-Math.floor(v)};
E.clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
E.buffer=()=>{const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;return c};
E.register=(name,draw,reset)=>{E.hooks.push({name,draw});if(reset)E.resets.push(reset)};
E.infect=(x,y,power=1)=>{
 const col=Math.floor(x*E.cols),row=Math.floor(y*E.rows);
 for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const xx=col+i,yy=row+j;if(xx<0||xx>=E.cols||yy<0||yy>=E.rows)continue;const index=yy*E.cols+xx;E.grid[index]=E.clamp(E.grid[index]+power*.15/(1+i*i+j*j))}
};
function resize(){E.w=innerWidth;E.h=innerHeight;E.dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(E.w*E.dpr);canvas.height=Math.round(E.h*E.dpr);ctx.setTransform(E.dpr,0,0,E.dpr,0,0);draw()}
function foundation(){
 const w=E.w,h=E.h,t=E.time,p=E.pointer;
 ctx.fillStyle='#050710';ctx.fillRect(0,0,w,h);
 const glow=ctx.createRadialGradient(w*.52,h*.49,0,w*.52,h*.49,w*.7);glow.addColorStop(0,'#153365');glow.addColorStop(.55,'#0b152c');glow.addColorStop(1,'#020409');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 // An immaculate spectrum, waiting for the first impossible address.
 const left=w*.15,top=h*.19,rw=w*.7,rh=h*.62;
 ctx.save();ctx.beginPath();ctx.rect(left,top,rw,rh);ctx.clip();
 const grad=ctx.createLinearGradient(left,0,left+rw,0);['#102cfa','#28e3f4','#e4f2bf','#fe6741','#f1118b','#5920ab'].forEach((c,i)=>grad.addColorStop(i/5,c));ctx.fillStyle=grad;ctx.fillRect(left,top,rw,rh);
 ctx.globalCompositeOperation='multiply';
 for(let i=0;i<84;i++){const yy=top+i/84*rh,phase=i*.07+t*.08;ctx.fillStyle='rgba(1,3,24,'+(.17+.35*(.5+.5*Math.sin(phase)))+')';ctx.beginPath();ctx.moveTo(left,yy);ctx.bezierCurveTo(left+rw*.3,yy+Math.sin(phase)*rh*.16,left+rw*.7,yy-Math.cos(phase)*rh*.17,left+rw,yy);ctx.lineTo(left+rw,yy+rh/84*.6);ctx.bezierCurveTo(left+rw*.7,yy-Math.cos(phase)*rh*.17+4,left+rw*.3,yy+Math.sin(phase)*rh*.16+4,left,yy+4);ctx.closePath();ctx.fill()}
 ctx.globalCompositeOperation='screen';ctx.strokeStyle='#b5dfea60';ctx.lineWidth=.7;
 for(let i=0;i<29;i++){const xx=left+i/28*rw;ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx+Math.sin(t*.12+i*.2)*E.level*70,top+rh);ctx.stroke()}
 for(let i=0;i<21;i++){ctx.beginPath();ctx.moveTo(left,top+i/20*rh);ctx.lineTo(left+rw,top+i/20*rh);ctx.stroke()}
 ctx.restore();
 ctx.strokeStyle='#bfe9ff80';ctx.lineWidth=1;ctx.strokeRect(left-.5,top-.5,rw+1,rh+1);
 ctx.save();ctx.translate(w*.5,h*.5);ctx.rotate(t*.013);
 for(let i=0;i<4;i++){ctx.strokeStyle=i%2?'#f8ffffaa':'#080e1fcc';ctx.lineWidth=i%2?1:4;ctx.beginPath();ctx.ellipse(0,0,rh*(.24+i*.047),rh*(.24+i*.047),0,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
 ctx.fillStyle='#e9fbff';ctx.font='9px monospace';ctx.fillText('REFERENCE SURFACE / '+E.seed.toString(16).toUpperCase(),left,top-12);ctx.fillText('01  02  04  08  16  32  64  128  256  512  1024',left,top+rh+19);
 for(const x of [left-15,left+rw+15])for(const y of [top-15,top+rh+15]){ctx.strokeStyle='#bfe9ff';ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.stroke()}
}
function damage(){
 const cw=E.w/E.cols,ch=E.h/E.rows;
 for(let n=0;n<E.grid.length;n++){
  const v=E.grid[n];if(v<.025)continue;
  const x=n%E.cols*cw,y=Math.floor(n/E.cols)*ch,r=E.hash(n);
  ctx.globalAlpha=Math.min(.92,v*.8);
  ctx.fillStyle=v>.74?'#03040b':E.palette[Math.floor(r*E.palette.length)];ctx.fillRect(x,y,cw*(r>.85?2.8:1)+.4,ch+.4);
  if(v>.2){ctx.globalAlpha=Math.min(.7,v);ctx.fillStyle=E.palette[(n+2)%6];for(let k=0;k<3;k++)if(E.hash(n+k*31)>.4)ctx.fillRect(x+(k/3)*cw,y+ch*.2,cw*.17,ch*.6)}
 }
 ctx.globalAlpha=1;
}
function advance(){
 const dt=E.dt;E.time+=dt;E.pointer.speed*=Math.exp(-dt*4);E.pressure+=(E.held?1:0-E.pressure)*Math.min(1,dt*3);E.pressure=E.clamp(E.pressure);
 E.level=E.clamp(E.level+dt*.0018+E.pointer.speed*dt*.007);
 spread+=dt*(6+E.level*110);
 while(spread>=1){spread--;const i=Math.floor(E.rand()*E.grid.length);if(E.grid[i]>.03){const j=i+[1,-1,E.cols,-E.cols][Math.floor(E.rand()*4)];if(j>=0&&j<E.grid.length)E.grid[j]=E.clamp(E.grid[j]+E.grid[i]*.13+.007);E.grid[i]=E.clamp(E.grid[i]+.009)}else if(E.rand()<.04+E.level*.4)E.grid[i]=.03+E.level*.1}
 if(E.held)E.infect(E.pointer.x,E.pointer.y,dt*3);
}
function draw(){
 foundation();damage();
 for(const hook of E.hooks){ctx.save();try{hook.draw(E)}finally{ctx.restore()}}
 ctx.fillStyle='#01040e20';for(let y=0;y<E.h;y+=4)ctx.fillRect(0,y,E.w,1);
 if(E.inside){const x=E.pointer.x*E.w,y=E.pointer.y*E.h;ctx.strokeStyle='#faffdba0';ctx.lineWidth=1;ctx.strokeRect(x-7,y-7,14,14);ctx.font='9px monospace';ctx.fillStyle='#e0faff';ctx.fillText(Math.floor(x).toString(16)+':'+Math.floor(y).toString(16),x+14,y-10)}
 if(E.time-readout>.15||E.paused){readout=E.time;document.getElementById('meter').textContent='COHERENCE '+((1-E.level)*100).toFixed(3)+'%';document.getElementById('clock').textContent=new Date(E.time*1000).toISOString().slice(14,23)}
}
E.draw=draw;
function queue(){if(!E.frame&&!E.paused&&!document.hidden)E.frame=requestAnimationFrame(tick)}
function tick(now){E.frame=0;E.dt=Math.min((now-E.last)||16,40)/1000;E.last=now;advance();draw();queue()}
function setPaused(value){E.paused=value;const b=document.getElementById('pause');b.textContent=value?'Resume':'Pause';b.setAttribute('aria-pressed',String(value));if(value){cancelAnimationFrame(E.frame);E.frame=0}else{E.last=performance.now();queue()}}
function input(e){if(!e.isPrimary||(pointerId!==null&&e.pointerId!==pointerId))return;const p=E.pointer;const x=E.clamp(e.clientX/E.w),y=E.clamp(e.clientY/E.h),dist=Math.hypot(x-p.x,y-p.y);p.px=p.x;p.py=p.y;p.x=x;p.y=y;p.speed=Math.min(5,p.speed+dist*12);E.inside=true;E.level=E.clamp(E.level+dist*.003);E.infect(x,y,Math.min(1,.1+dist*7));for(const fn of E.inputs)fn(E,e,dist);if(E.paused)draw()}
canvas.addEventListener('pointermove',input,{passive:true});canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||pointerId!==null)return;pointerId=e.pointerId;E.held=true;canvas.setPointerCapture(e.pointerId);input(e)});
function release(e){if(pointerId!==e.pointerId)return;E.held=false;pointerId=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(E.paused)draw()}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerleave',()=>{E.inside=false;if(E.paused)draw()});window.addEventListener('blur',()=>{E.held=false;pointerId=null});
document.getElementById('pause').onclick=()=>setPaused(!E.paused);
document.getElementById('reset').onclick=()=>{crypto.getRandomValues(seedBuffer);E.seed=seedBuffer[0];state=E.seed;E.level=0;E.time=0;E.grid.fill(0);E.pointer.speed=0;E.pressure=0;spread=0;readout=0;E.resets.forEach(fn=>fn(E));document.getElementById('live').textContent='New specimen '+E.seed.toString(16);draw()};
document.getElementById('export').onclick=()=>canvas.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=String(E.generation).padStart(3,'0')+'-'+E.seed.toString(16)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png');
window.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('button,input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();setPaused(!E.paused)}else if(e.code==='KeyR')document.getElementById('reset').click()});
reduced.addEventListener('change',e=>setPaused(e.matches));document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(E.frame);E.frame=0}else{E.last=performance.now();queue()}});
window.addEventListener('resize',resize);resize();setPaused(E.paused);
})();
</script>
<!-- MILESTONE 002: AFTERIMAGE DEBT; PARENT 001-signal.html -->
<script>
(()=>{const E=window.Decay;if(!E)return;E.generation=2;E.title="AFTERIMAGE DEBT";
// The frame starts believing its own old frames. Misregistration persists.
const memory=E.buffer(),m=memory.getContext('2d');let ready=false;
E.register('retention',()=>{
 const {ctx:c,w,h}=E;
 if(memory.width!==E.canvas.width||memory.height!==E.canvas.height){memory.width=E.canvas.width;memory.height=E.canvas.height;ready=false}
 if(ready){
  const loss=.08+E.level*.55+E.pointer.speed*.05;
  c.globalAlpha=Math.min(.84,loss);c.globalCompositeOperation='screen';
  const dx=Math.sin(E.time*.33)*(.5+E.level*18)+E.pointer.speed*3;
  c.drawImage(memory,dx,-E.level*4,w*(1+E.level*.005),h*(1+E.level*.005));
  c.globalAlpha=Math.min(.8,.12+E.level*.5);c.globalCompositeOperation='source-over';
  const y=Math.floor(E.pointer.y*h/8)*8;
  c.drawImage(memory,0,Math.max(0,y-24)*E.dpr,memory.width,Math.min(48,h-y+24)*E.dpr,Math.sin(E.time*.2)*E.level*60,Math.max(0,y-24),w,Math.min(48,h-y+24));
 }
 m.clearRect(0,0,memory.width,memory.height);m.drawImage(E.canvas,0,0);ready=true;
},()=>{ready=false});
E.level=.035;
document.getElementById('help').innerHTML='MOVE TO MISREGISTER THE PRESENT<br>THE PREVIOUS FRAME HAS NOT LEFT';

E.draw();
})();
</script>
<!-- MILESTONE 003: SCANLINE AMNESIA; PARENT 002-afterimage.html -->
<script>
(()=>{const E=window.Decay;if(!E)return;E.generation=3;E.title="SCANLINE AMNESIA";
// The raster loses horizontal lock one band at a time.
const raster=E.buffer(),rasterCtx=raster.getContext('2d');
const offsets=new Float32Array(72),targets=new Float32Array(72);
let lastFault=0;
E.inputs.push((s,e,dist)=>{const row=Math.min(71,Math.floor(s.pointer.y*72));targets[row]+=(s.pointer.x-s.pointer.px)*s.w*3;targets[(row+1)%72]-=dist*s.w;});
E.register('scanline-amnesia',()=>{
 const {ctx:c,w,h}=E;
 if(raster.width!==E.canvas.width||raster.height!==E.canvas.height){raster.width=E.canvas.width;raster.height=E.canvas.height}
 rasterCtx.drawImage(E.canvas,0,0);
 if(E.time-lastFault>.3){lastFault=E.time;const i=Math.floor(E.rand()*72);targets[i]=(E.rand()-.5)*w*(.01+E.level*.4);if(E.rand()<E.level)targets[(i+1)%72]=targets[i]*-.45}
 const bh=h/72;
 for(let i=0;i<72;i++){
  offsets[i]+=(targets[i]-offsets[i])*.08;
  const shift=offsets[i];if(Math.abs(shift)<.5)continue;
  const y=i*bh;const sy=Math.min(raster.height-1,y*E.dpr),sh=Math.min(raster.height-sy,bh*E.dpr);
  c.globalAlpha=.92;c.drawImage(raster,0,sy,raster.width,sh,shift,y,w,bh+.5);
  c.globalAlpha=.3;c.fillStyle=E.palette[i%6];c.fillRect(shift>0?0:w+shift,y,Math.abs(shift),1);
 }
 c.globalAlpha=.4;c.fillStyle='#ecfff5';
 const rolling=(E.time*13)%h;c.fillRect(0,rolling,w,.7);
},()=>{offsets.fill(0);targets.fill(0);lastFault=0});
E.level=.07;
document.getElementById('help').innerHTML='DRAG ACROSS THE SCANLINES<br>SYNC CANNOT FIND THE SAME ROW TWICE';

E.draw();
})();
</script>
<!-- MILESTONE 004: ADDRESS SPACE; PARENT 003-scanline.html -->
<script>
(()=>{const E=window.Decay;if(!E)return;E.generation=4;E.title="ADDRESS SPACE";
// Blocks retain their addresses after their contents have moved away.
const cache=E.buffer(),cacheCtx=cache.getContext('2d'),pages=[];let allocation=0;
function allocate(x,y,size){
 const wide=(.035+E.rand()*.11)*size,high=(.012+E.rand()*.09)*size;
 pages.push({x:E.clamp(x),y:E.clamp(y),w:wide,h:high,sx:E.rand()*.75,sy:E.rand()*.75,life:0,skew:(E.rand()-.5)*.15,id:Math.floor(E.rand()*65535).toString(16).padStart(4,'0')});if(pages.length>64)pages.shift();
}
E.inputs.push((s,e,d)=>{if(d>.004)allocate(s.pointer.x,s.pointer.y,1+d*3)});
E.register('address-space',()=>{
 const {ctx:c,w,h}=E;if(cache.width!==E.canvas.width||cache.height!==E.canvas.height){cache.width=E.canvas.width;cache.height=E.canvas.height}
 cacheCtx.drawImage(E.canvas,0,0);
 if(E.time-allocation>Math.max(.12,2-E.level*2)){allocation=E.time;allocate(E.rand(),E.rand(),1)}
 for(const block of pages){
  if(!E.paused)block.life+=E.dt;
  const x=block.x*w,y=block.y*h,bw=block.w*w,bh=block.h*h;
  c.globalAlpha=Math.min(.88,.12+block.life*.04+E.level*.4);
  c.drawImage(cache,block.sx*cache.width,block.sy*cache.height,Math.max(1,Math.min(cache.width*(block.w*.8),cache.width*(1-block.sx))),Math.max(1,Math.min(cache.height*block.h,cache.height*(1-block.sy))),x,y,bw,bh);
  c.fillStyle=E.palette[parseInt(block.id,16)%6];c.globalAlpha=.3;c.fillRect(x,y,bw,2);
  c.globalAlpha=.6;c.font='8px monospace';c.fillStyle='#d5f5ef';c.fillText('0x'+block.id,x+2,y-3);
  if(block.life>10){c.globalAlpha=.35;c.fillStyle='#03060e';c.fillRect(x+bw*.6,y,bw*.4,bh)}
 }
},()=>{pages.length=0;allocation=0});
E.level=.11;
document.getElementById('help').innerHTML='MOVE TO ALLOCATE THE WRONG MEMORY<br>THE ADDRESS OUTLIVES THE IMAGE';

E.draw();
})();
</script>
<!-- MILESTONE 005: BITPLANE DIVORCE; PARENT 004-addresses.html -->
<script>
(()=>{const E=window.Decay;if(!E)return;E.generation=5;E.title="BITPLANE DIVORCE";
// Colour channels stop agreeing on which bit belongs to which pixel.
const bitplane=document.createElement('canvas');bitplane.width=240;bitplane.height=150;
const bitCtx=bitplane.getContext('2d',{willReadFrequently:true});let refresh=-1;
E.register('bitplane-divorce',()=>{
 const {ctx:c,w,h}=E;
 if(E.time-refresh>.1||E.paused){
  refresh=E.time;bitCtx.drawImage(E.canvas,0,0,240,150);
  const pixels=bitCtx.getImageData(0,0,240,150),data=pixels.data;
  const shift=1+Math.floor(E.level*5),mask=(255<<shift)&255;
  for(let y=0;y<150;y++)for(let x=0;x<240;x++){
   const i=(y*240+x)*4,j=(y*240+(x+Math.floor(1+E.level*13))%240)*4;
   const v=E.grid[Math.min(E.grid.length-1,Math.floor(y/150*E.rows)*E.cols+Math.floor(x/240*E.cols))];
   if(v>.04||E.hash(Math.floor(x/12)+Math.floor(y/6)*20)<E.level*.45){
    data[i]=(data[i]&mask)^(E.level>.4?48:16);data[i+1]=data[j+2]&mask;data[i+2]=data[j+1]&mask;
   }
  }
  bitCtx.putImageData(pixels,0,0);
 }
 c.imageSmoothingEnabled=false;c.globalAlpha=.16+E.level*.58;c.drawImage(bitplane,0,0,w,h);
 c.globalAlpha=.12+E.level*.14;c.globalCompositeOperation='screen';
 c.drawImage(bitplane,Math.sin(E.time*.7)*E.level*24,0,w,h);
},()=>{refresh=-1;bitCtx.clearRect(0,0,240,150)});
E.level=.15;
document.getElementById('help').innerHTML='THE RED CHANNEL REMEMBERS SOMETHING ELSE<br>MOVE TO LOSE ANOTHER BIT';

})();
</script>
<!-- MILESTONE 006: DEAD LETTER OFFICE; PARENT 005-bitplanes.html -->
<script>
(()=>{const E=window.Decay;if(!E)return;E.generation=6;E.title="DEAD LETTER OFFICE";
// Language is another texture allocation. The pointer is no longer singular.
const echoes=[];E.inputs.push((s,e,d)=>{if(d>.003){echoes.push({x:s.pointer.x,y:s.pointer.y,birth:s.time});if(echoes.length>42)echoes.shift()}});
const lexicon=['FRAME','LOST','LOST','FOUND?','NULL','STILL HERE','DO NOT RECALL','0x00000000'];
E.register('dead-letters',()=>{
 const {ctx:c,w,h}=E,scale=Math.min(w,h);

  const x=E.hash(i+160)*w,y=E.hash(i+192)*h;

  const pt=echoes[i],age=E.time-pt.birth,x=pt.x*w,y=pt.y*h;

  c.globalAlpha=Math.max(.08,.55-age*.02);c.fillStyle=i%3?'#c9f0de':'#f984a0';c.strokeStyle='#03090e';c.lineWidth=1;
  c.beginPath();c.moveTo(0,0);c.lineTo(0,17);c.lineTo(5,13);c.lineTo(9,22);c.lineTo(12,20);c.lineTo(8,12);c.lineTo(15,12);c.closePath();c.fill();c.stroke();c.restore();
 }

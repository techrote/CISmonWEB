name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check

  windows-firefox-acceptance:
    name: Windows / Firefox Focus acceptance
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Windows Node and filesystem regressions
        run: npm test
      - name: Install temporary Firefox test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Playwright Firefox
        run: npx playwright install firefox
      - name: Verify browser smoke script syntax
        run: node --check tooling/focus-firefox-acceptance.mjs
      - name: Run real Firefox / Windows app acceptance
        run: node tooling/focus-firefox-acceptance.mjs
      - name: Verify focused duration/header browser script syntax
        run: node --check tooling/duration-compact-firefox-acceptance.mjs
      - name: Run duration inheritance and compact-header Firefox acceptance
        run: node tooling/duration-compact-firefox-acceptance.mjs
      - name: Upload header visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-duration-header-firefox
          path: artifacts/focus-duration/*.png
          if-no-files-found: ignore
